<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thirst for Oxygen</title>
    <link rel="stylesheet" href="/src/home.css" />
  </head>
  <body>
    <video class="home-abyss-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="/assets/home/abyss-seafloor-ping-pong-067.mp4" type="video/mp4" />
    </video>

    <main
      class="home-intro"
      id="home-intro"
      data-turn-state="front"
      role="button"
      tabindex="0"
      aria-label="點擊任意位置，讓深海頭盔轉向側面"
    >
      <div class="home-helmet-stage" aria-live="polite">
        <img
          class="home-helmet-frame home-helmet-frame--front"
          src="/assets/home/helmet-turn-00-front.png"
          alt="正面朝向玩家的古老深海潛水頭盔"
        />
        <img
          class="home-helmet-frame home-helmet-frame--turn-one"
          src="/assets/home/helmet-turn-01.png"
          alt=""
          aria-hidden="true"
        />
        <img
          class="home-helmet-frame home-helmet-frame--turn-two"
          src="/assets/home/helmet-turn-02.png"
          alt=""
          aria-hidden="true"
        />
        <img
          class="home-helmet-frame home-helmet-frame--side"
          src="/assets/home/abandoned-diving-helmet-left-v2.png"
          alt=""
          aria-hidden="true"
        />

      </div>

      <section class="home-menu-panel" aria-label="Thirst for Oxygen 主選單">
        <div class="home-logo-viewport" aria-hidden="true">
          <img src="/assets/home/thirst-for-oxygen-logo-v2.png" alt="" />
        </div>
        <nav class="home-main-menu" id="home-main-menu" aria-label="主選單" aria-hidden="true" inert>
          <a class="home-menu-link home-menu-link--primary" href="/play.html"><span>01</span><strong>開始遊玩</strong></a>
          <a class="home-menu-link" href="/enemy-encyclopedia.html"><span>02</span><strong>世界圖鑑</strong></a>
          <a class="home-menu-link" href="/sandbox.html"><span>03</span><strong>敵人沙盒</strong></a>
          <a class="home-menu-link" href="/"><span>04</span><strong>地圖編輯器</strong></a>
        </nav>
      </section>
      <span class="visually-hidden" id="home-intro-status">頭盔目前面向正前方。</span>
    </main>

    <script type="module" src="/src/home-page.js"></script>
  </body>
</html>
